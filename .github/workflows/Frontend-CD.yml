name: Frontend CD

on:
  workflow_run:
    workflows:
      - "Frontend CI"
    types:
      - completed

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: react-vite-app
  CONTAINER_NAME: react-vite-app-container
  HOST_PORT: 8080
  CONTAINER_PORT: 80

jobs:
  deploy:

    # Deploy only when the CI workflow completed successfully
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    runs-on: ubuntu-latest

    steps:

      # --------------------------------------------------
      # 1. Checkout repository
      # --------------------------------------------------
      - name: Checkout code
        uses: actions/checkout@v4

      # --------------------------------------------------
      # 2. Configure AWS credentials
      # --------------------------------------------------
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      # --------------------------------------------------
      # 3. Login to Amazon ECR
      # --------------------------------------------------
      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      # --------------------------------------------------
      # 4. Build Docker image
      # --------------------------------------------------
      - name: Build Docker image
        run: docker build -t ${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.event.workflow_run.head_sha }} -t ${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest .
         

      # --------------------------------------------------
      # 5. Push Docker image to ECR
      # --------------------------------------------------
      - name: Push Docker image to ECR
        run: |
          docker push ${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.event.workflow_run.head_sha }}
          docker push ${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest
         

      # --------------------------------------------------
      # 6. Deploy to EC2
      # --------------------------------------------------
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.2

        env:
          AWS_REGION: ${{ env.AWS_REGION }}
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          ECR_REPOSITORY: ${{ env.ECR_REPOSITORY }}
          IMAGE_TAG: ${{ github.event.workflow_run.head_sha }}
          CONTAINER_NAME: ${{ env.CONTAINER_NAME }}
          HOST_PORT: ${{ env.HOST_PORT }}
          CONTAINER_PORT: ${{ env.CONTAINER_PORT }}

        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}

          envs: AWS_REGION,ECR_REGISTRY,ECR_REPOSITORY,IMAGE_TAG,CONTAINER_NAME,HOST_PORT,CONTAINER_PORT

          script: |
            set -e

            echo "======================================"
            echo "Starting deployment"
            echo "======================================"

            echo "Image:"
            echo "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

            # ------------------------------------------
            # 7. Login to ECR from EC2
            # ------------------------------------------
            echo "Logging in to Amazon ECR..."

            aws ecr get-login-password \
              --region "$AWS_REGION" |
              sudo docker login \
              --username AWS \
              --password-stdin "$ECR_REGISTRY"

            # ------------------------------------------
            # 8. Pull new Docker image
            # ------------------------------------------
            echo "Pulling new Docker image..."

            sudo docker pull \
              "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

            # ------------------------------------------
            # 9. Stop old container
            # ------------------------------------------
            echo "Stopping old container..."

            sudo docker stop "$CONTAINER_NAME" 2>/dev/null || true

            # ------------------------------------------
            # 10. Remove old container
            # ------------------------------------------
            echo "Removing old container..."

            sudo docker rm "$CONTAINER_NAME" 2>/dev/null || true

            # ------------------------------------------
            # 11. Start new container
            # ------------------------------------------
            echo "Starting new container..."

            sudo docker run -d \
              --name "$CONTAINER_NAME" \
              --restart unless-stopped \
              -p "$HOST_PORT:$CONTAINER_PORT" \
              "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

            # ------------------------------------------
            # 12. Wait for container to start
            # ------------------------------------------
            echo "Waiting for application..."

            sleep 10

            # ------------------------------------------
            # 13. Verify container is running
            # ------------------------------------------
            echo "Checking Docker container..."

            if ! sudo docker ps --format '{{.Names}}' |
              grep -q "^${CONTAINER_NAME}$"; then

              echo "ERROR: Container is not running."

              sudo docker ps -a

              echo "Container logs:"
              sudo docker logs "$CONTAINER_NAME" || true

              exit 1
            fi

            echo "Container is running."

            # ------------------------------------------
            # 14. Verify application through Docker
            # ------------------------------------------
            echo "Testing Docker application..."

            HTTP_STATUS=$(curl \
              --silent \
              --output /dev/null \
              --write-out "%{http_code}" \
              http://127.0.0.1:$HOST_PORT)

            echo "Docker HTTP status: $HTTP_STATUS"

            if [ "$HTTP_STATUS" != "200" ]; then

              echo "ERROR: Docker application verification failed."

              sudo docker logs "$CONTAINER_NAME" || true

              exit 1
            fi

            echo "Docker application verification successful."

            # ------------------------------------------
            # 15. Verify through host Nginx
            # ------------------------------------------
            echo "Testing Nginx reverse proxy..."

            NGINX_STATUS=$(curl \
              --silent \
              --output /dev/null \
              --write-out "%{http_code}" \
              http://127.0.0.1)

            echo "Nginx HTTP status: $NGINX_STATUS"

            if [ "$NGINX_STATUS" != "200" ]; then

              echo "ERROR: Nginx verification failed."

              sudo nginx -t || true
              sudo systemctl status nginx --no-pager || true
              sudo docker logs "$CONTAINER_NAME" || true

              exit 1
            fi

            echo "Nginx verification successful."

            # ------------------------------------------
            # 16. Final verification
            # ------------------------------------------
            echo "======================================"
            echo "Deployment successful!"
            echo "======================================"

            echo "Container:"
            sudo docker ps --filter "name=$CONTAINER_NAME"

            echo ""
            echo "Docker endpoint:"
            echo "http://127.0.0.1:$HOST_PORT"

            echo ""
            echo "Nginx endpoint:"
            echo "http://127.0.0.1:80"
